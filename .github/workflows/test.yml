name: test

on:
  push:
  pull_request:

jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Rust is preinstalled on the runner. Fail if any version was skipped, not just if one failed.
      - run: chat/test/run.sh | tee results.txt && ! grep -q '^skip' results.txt
